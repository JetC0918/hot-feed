name: HotFeed CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan client artifacts for server secrets
        shell: bash
        run: |
          if grep -R -n -E 'REDDIT_CLIENT_ID|REDDIT_CLIENT_SECRET' dist; then
            echo 'server-only environment key leaked into client artifact' >&2
            exit 1
          fi
